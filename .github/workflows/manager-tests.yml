name: Manager host tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Cheat / custom-code / mod manager regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Configure isolated manager tests
        run: |
          cmake -S tests/manager -B build-manager/tests -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build manager tests
        run: cmake --build build-manager/tests --parallel 2

      - name: Run manager tests
        run: ctest --test-dir build-manager/tests --output-on-failure
