name: Build Android APK (v1.5.5-test)

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OceanTriRecomp Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run isolated manager host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
          cmake -S tests/manager -B build-manager/tests -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-manager/tests --parallel 2
          ctest --test-dir build-manager/tests --output-on-failure
          python3 -m unittest discover -s tests/android -p 'test_*.py' -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK & NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build Translator CLI
        run: |
          dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj -c Release

      - name: Build OpenSSL for Android ARM64
        run: |
          git clone --depth 1 -b openssl-3.0.15 https://github.com/openssl/openssl.git $RUNNER_TEMP/openssl-src
          cd $RUNNER_TEMP/openssl-src
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=29 no-shared no-tests --prefix=$RUNNER_TEMP/openssl-android
          make -j$(nproc)
          make install_sw
          if [ -d "$RUNNER_TEMP/openssl-android/lib64" ] && [ ! -d "$RUNNER_TEMP/openssl-android/lib" ]; then
            ln -s lib64 "$RUNNER_TEMP/openssl-android/lib"
          fi
          echo "OPENSSL_ANDROID_DIR=$RUNNER_TEMP/openssl-android" >> $GITHUB_ENV

      - name: Compile Native Libraries and Package APK
        id: android_build
        run: |
          set -o pipefail
          chmod +x scripts/build-android.sh packaging/android/build_apk.sh
          bash scripts/build-android.sh 2>&1 | tee build-android.log

      - name: Report Android build failure tail
        if: failure() && steps.android_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Android build failed. Last 200 log lines:'
            echo '```'
            tail -n 200 build-android.log
            echo '```'
          } > build-failure-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@build-failure-comment.md

      - name: Upload Android build log
        if: failure() && steps.android_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-android.log
          if-no-files-found: warn

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-v1.5.5-test-arm64
          path: release/OceanTriRecomp-Android-v1.5.5-test-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.5-test
          name: "OceanTriRecomp Android v1.5.5-test"
          body: |
            ## OceanTriRecomp Android v1.5.5-test 🦖📱

            Android ARM64 test build (`versionCode=10`, `versionName=1.5.5-test`).

            ### Added
            - Offline **Cheat Manager** with curated native cheats, save-risk confirmations, profile import/export, Master/all-OFF/reset/repeat controls, and whole-row touch activation.
            - Strict mapped custom RAM-write codes (Gecko-style `00`/`02`/`04` writes only; unsafe code types rejected).
            - Package-based **Mod Manager** with SHA-256 validation, live HD texture activation, next-launch model/audio replacements, priority handling, and isolated mod caches.
            - English README and expanded cheat/mod documentation.

            ### Fixed
            - Android startup abort caused by mismatched SDL JNI runtimes. The APK now uses one vendored SDL 3.4.16 static runtime in `libmain.so`.
            - False “online session” cheat lock in offline village gameplay.
            - Cheat rows that only responded on the small toggle button and confirmations that left Master OFF.

            ### Notes
            - PAL `RMHP08` is the supported disc for runtime manager features.
            - Cheats can modify save data. Back up `/storage/emulated/0/MH3` before experimenting.
            - Cheats remain blocked in online/City sessions; return offline and relaunch for a clean guard.
            - CI builds may use an ephemeral signing key. If an update fails, back up your data, uninstall the previous CI APK, and reinstall.
          files: release/OceanTriRecomp-Android-v1.5.5-test-arm64.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
