name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gecko parser/interpreter tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I runtime/include \
            runtime/src/gecko/gecko_compat.cpp \
            runtime/src/gecko/gecko_parser.cpp \
            runtime/src/gecko/gecko_memory.cpp \
            runtime/src/gecko/gecko_interpreter.cpp \
            runtime/src/gecko/gecko_tests.cpp \
            -o /tmp/mh3_gecko_check
          /tmp/mh3_gecko_check

      - name: Gecko runtime/storage tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I runtime/include \
            runtime/src/gecko/gecko_compat.cpp \
            runtime/src/gecko/gecko_parser.cpp \
            runtime/src/gecko/gecko_memory.cpp \
            runtime/src/gecko/gecko_interpreter.cpp \
            runtime/src/gecko/gecko_memory_guest.cpp \
            runtime/src/gecko/gecko_manager.cpp \
            runtime/src/gecko/gecko_storage.cpp \
            runtime/src/gecko/gecko_runtime_tests.cpp \
            runtime/src/memory.cpp \
            runtime/src/guest_flat_memory.cpp \
            -o /tmp/mh3_gecko_runtime_check
          /tmp/mh3_gecko_runtime_check

  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build native dispatch translator
        run: |
          dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj -c Release --nologo

      - name: Build native runtime
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          cmake -S runtime -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID=ON \
            -DAURORA_SDL3_PROVIDER=vendor \
            -DAURORA_SDL3_LINKAGE=shared
          cmake --build build-android --target MH3 --parallel

      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          export MH3_MAIN_LIB="$(find build-android -name 'libmain.so' | head -n 1)"
          export MH3_SDL3_LIB="$(find build-android -name 'libSDL3.so' | head -n 1)"
          export MH3_PNG_LIB="$(find build-android -name 'libpng16.so' | head -n 1)"
          bash packaging/android/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-apk
          path: release/*.apk
